name: Deploy to GitHub Pages

on:
  push:
    # Which pushes are worth starting a run for. Without this every push to every working
    # branch spins up a run that immediately skips, which fills the Actions tab with noise.
    branches: [master, main]
  # So a branch can be published on demand, including before it is the default one.
  workflow_dispatch:

# Only what Pages needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Which branch may actually *publish*, which is a different question from which pushes start
    # a run. The trigger above is about noise; this is about correctness. Asking the repository
    # for its default branch rather than naming one here means that if the default is ever moved
    # again, a leftover `master` cannot go on quietly publishing a stale site.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is only worth publishing if the simulation behind it is sound.
      - run: npm run lint
      - run: npm test

      - run: npm run build

      # A project Pages site is served under /<repo>/, so an absolute asset path builds
      # cleanly, deploys cleanly, and produces a blank page. Cheap to check, invisible to
      # every other signal.
      - run: npm run check:pages

      # Also publish the standalone single file, so the game can be downloaded and run
      # offline from one document.
      - run: npm run bundle
      - run: cp dist-single/powergrid-tycoon.html dist/powergrid-tycoon.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
