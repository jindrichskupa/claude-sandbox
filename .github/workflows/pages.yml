name: Deploy to GitHub Pages

on:
  push:
  # So a branch can be published before it is merged.
  workflow_dispatch:

# Only what Pages needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Publish whatever the default branch happens to be, rather than a branch named here.
    # Naming one would be wrong twice over: it is wrong today, because this repository's
    # default branch is not called main, and it would go stale again the moment the branch is
    # renamed or merged. Asking the repository what its default branch is cannot drift.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is only worth publishing if the simulation behind it is sound.
      - run: npm run lint
      - run: npm test

      - run: npm run build

      # Also publish the standalone single file, so the game can be downloaded and run
      # offline from one document.
      - run: npm run bundle
      - run: cp dist-single/powergrid-tycoon.html dist/powergrid-tycoon.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
